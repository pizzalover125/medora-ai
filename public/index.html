<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#efece6">
  <title>Ask</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/games.css">
  <link rel="stylesheet" href="/static/weather.css">
  <link rel="stylesheet" href="/static/dock.css">
  <link rel="stylesheet" href="/static/messages.css">
  <link rel="stylesheet" href="/static/call.css">
  <link rel="stylesheet" href="/static/hr.css">
  <link rel="stylesheet" href="/static/medora.css">
  <link rel="stylesheet" href="/static/news.css">
</head>
<body data-state="idle">

  <button id="orb" class="orb" type="button" aria-label="Press to ask a question">
    <span class="orb__halo" aria-hidden="true"></span>
    <span class="orb__ripples" aria-hidden="true">
      <span class="ripple"></span>
      <span class="ripple"></span>
      <span class="ripple"></span>
    </span>
    <span class="orb__arc" aria-hidden="true"></span>
    <span class="orb__spark" aria-hidden="true"></span>
    <span class="orb__core" aria-hidden="true"></span>
  </button>

  <nav class="app-dock" aria-label="Apps">
    <button class="app-dock__item is-active" type="button" data-app="ask"
            data-tooltip="Ask" aria-label="Ask" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="7.25"></circle>
        <circle cx="12" cy="12" r="2.1" class="app-dock__fill"></circle>
      </svg>
    </button>

    <span class="app-dock__rule" aria-hidden="true"></span>

    <button class="app-dock__item" type="button" data-app="weather"
            data-tooltip="Weather" aria-label="Weather" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8.2 8.25a4.1 4.1 0 0 1 7.65 2.07A3.75 3.75 0 1 1 16.75 17H7.5a4.5 4.5 0 0 1 .7-8.75Z"></path>
        <path d="M5 3.5v2M1.75 6.75h2M2.7 4.45l1.4 1.4"></path>
      </svg>
    </button>

    <button class="app-dock__item" type="button" data-app="games"
            data-tooltip="Games" aria-label="Games" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8.25 9.25v5.5M5.5 12h5.5"></path>
        <circle cx="16.5" cy="10" r=".8" class="app-dock__fill"></circle>
        <circle cx="18.75" cy="13" r=".8" class="app-dock__fill"></circle>
        <path d="M7.2 6.5h9.6a4 4 0 0 1 3.82 2.82l1.1 3.58a3.58 3.58 0 0 1-6.3 3.24l-.92-1.19h-5l-.92 1.19a3.58 3.58 0 0 1-6.3-3.24l1.1-3.58A4 4 0 0 1 7.2 6.5Z"></path>
      </svg>
    </button>

    <button class="app-dock__item" type="button" data-app="messages"
            data-tooltip="Messages" aria-label="Messages" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.5 12.4c0 3.7-3.6 6.7-8 6.7a9.7 9.7 0 0 1-2.4-.3l-4.4 1.6 1.3-3.5a6.2 6.2 0 0 1-2.5-4.5c0-3.7 3.6-6.7 8-6.7s8 3 8 6.7Z"></path>
        <path d="M9 12.2h.01M12.5 12.2h.01M16 12.2h.01"></path>
      </svg>
    </button>

    <button class="app-dock__item" type="button" data-app="calendar"
            data-tooltip="Calendar" aria-label="Calendar" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3.25" y="5.25" width="17.5" height="15.5" rx="3"></rect>
        <path d="M7.5 3v4.25M16.5 3v4.25M3.5 9.5h17"></path>
        <path d="M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01"></path>
      </svg>
    </button>

    <button class="app-dock__item" type="button" data-app="medora"
            data-tooltip="Medora" aria-label="Medora" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <g transform="rotate(-45 12 12)">
          <rect x="3.25" y="8.5" width="17.5" height="7" rx="3.5"></rect>
          <path d="M12 8.5v7"></path>
        </g>
      </svg>
    </button>

    <button class="app-dock__item" type="button" data-app="news"
            data-tooltip="News" aria-label="News" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3.5" y="5.5" width="17" height="13" rx="1.75"></rect>
        <path d="M7 9.25h6M7 12h10M7 14.75h10"></path>
      </svg>
    </button>
  </nav>

  <script src="/static/session.js"></script>
  <script src="/static/push.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="/static/win.js"></script>
  <script src="/static/games.js"></script>
  <script src="/static/weather.js"></script>
  <script src="/static/calendar.js"></script>
  <script src="/static/call.js"></script>
  <script src="/static/messages.js"></script>
  <script src="/static/medora.js"></script>
  <script src="/static/news.js"></script>
  <script src="/static/dock.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
